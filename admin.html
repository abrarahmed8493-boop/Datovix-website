<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DATOVIX Admin</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="admin.js"></script></head><body class="admin-page"><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">D</span><span>DATOVIX<small>ADMINISTRATION</small></span></a><a href="index.html">← Back to website</a></header><main class="admin-wrap"><section class="admin-login" id="loginPanel"><h1>Administrator login</h1><p>Sign in with an authorised DATOVIX admin account.</p><form id="loginForm"><label>Email<input type="email" name="email" required></label><label>Password<input type="password" name="password" required></label><button class="button primary" type="submit">Sign in</button><p id="loginMessage" class="form-message"></p></form></section><section id="dashboardPanel" hidden><div class="admin-heading"><div><div class="section-label">DATOVIX CONTROL CENTRE</div><h1>Enquiry dashboard</h1></div><button id="logoutButton" class="button secondary dark-button">Sign out</button></div><div class="admin-stats"><div><small>Total enquiries</small><b id="totalCount">0</b></div><div><small>New enquiries</small><b id="newCount">0</b></div><div><small>Converted</small><b id="convertedCount">0</b></div></div><div class="admin-tools"><input id="searchInput" placeholder="Search name, company or email"><select id="statusFilter"><option value="">All statuses</option><option>New</option><option>Contacted</option><option>In Discussion</option><option>Converted</option><option>Rejected</option></select><button id="exportButton" class="button primary">Export CSV</button></div><div class="table-wrap"><table><thead><tr><th>Reference / Date</th><th>Customer</th><th>Services</th><th>Industry</th><th>Status</th><th>Details</th></tr></thead><tbody id="enquiryRows"><tr><td colsp
